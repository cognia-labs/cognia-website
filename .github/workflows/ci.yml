name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run the preserved full-mode changed-file coverage gate
        type: boolean
        default: false
      notification_run_id:
        description: Optional completed source run for a secret-free Feishu preview
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  website:
    name: Standalone website
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WEBSITE_CI_REPORTS: "true"
      JEST_JUNIT_OUTPUT_DIR: test-results
      JEST_JUNIT_OUTPUT_NAME: junit-shard-1.xml
      NEXT_PUBLIC_WEB_SITE_URL: https://website.example.org
      NEXT_PUBLIC_DOCS_SITE_URL: https://docs.example.org
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm deploy:check
      - run: pnpm check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jest-shard-1
          path: test-results/junit-shard-1.xml
          retention-days: 7
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --reporter=list,json,html
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-json
          path: test-results/report.json
          retention-days: 7
      - name: Check the actual Pages redirect runtime
        run: |
          pnpm preview:pages > /tmp/pages-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" || true; cat /tmp/pages-preview.log' EXIT
          node scripts/check-pages-preview.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: static-website
          path: out/
          retention-days: 7
  container:
    name: Deployment container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build standalone deployment image
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_WEB_SITE_URL=https://website.example.org
          --build-arg NEXT_PUBLIC_DOCS_SITE_URL=https://docs.example.org
          -t cognia-website:ci .
      - name: Smoke-test static routes, redirect and 404
        run: |
          docker run -d --name website -p 3002:3002 cognia-website:ci
          trap 'docker logs website; docker rm -f website' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3002/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3002/zh/product >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3002/en/product)" = 301
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3002/missing-page)" = 404
  changed-coverage:
    name: Full-mode changed-file coverage
    if: github.event_name == 'pull_request' || inputs.full_validation == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the original 90 percent changed-file thresholds in full mode
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COVERAGE_FULL: ${{ inputs.full_validation == true || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          if [ -z "$COVERAGE_BASE_SHA" ]; then export COVERAGE_BASE_SHA="$(git rev-parse HEAD^)"; fi
          pnpm coverage:changed
  notification-preview:
    name: Feishu dry-run preview
    if: github.event_name == 'workflow_dispatch' && inputs.notification_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Generate preview without webhook credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FEISHU_OUTPUT_DIR: ${{ runner.temp }}/feishu-preview
          SOURCE_RUN_ID: ${{ inputs.notification_run_id }}
          DRY_RUN: "true"
          FEISHU_MODE: all
        run: node scripts/ci/feishu/notify.mjs prepare
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: feishu-dry-run-preview
          path: |
            ${{ runner.temp }}/feishu-preview/preview.json
            ${{ runner.temp }}/feishu-preview/preview.html
            ${{ runner.temp }}/feishu-preview/diagnostic.json
          if-no-files-found: error
          retention-days: 14
